name: Deploy Frontend (Static Web App)

on:
  push:
    branches: [main]
    paths:
      - 'src/Presentation/NutritionTracker.Web/**'
      - '.github/workflows/deploy-frontend.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'src/Presentation/NutritionTracker.Web/**'
  workflow_dispatch:

env:
  APP_LOCATION: 'src/Presentation/NutritionTracker.Web'
  OUTPUT_LOCATION: 'dist'

jobs:
  build-and-deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: ${{ env.APP_LOCATION }}
          output_location: ${{ env.OUTPUT_LOCATION }}
        env:
          # Read by `npm run build` (Oryx auto-detects and runs it) to bake the API URL into the bundle.
          VITE_API_URL: ${{ vars.FUNCTION_APP_URL }}

  close-pull-request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close PR preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          app_location: ${{ env.APP_LOCATION }}
          action: 'close'
