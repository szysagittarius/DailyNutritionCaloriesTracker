name: Deploy Frontend (Static Web App)

on:
  push:
    branches: [main]
    paths:
      - 'src/Presentation/NutritionTracker.Web/**'
      - '.github/workflows/deploy-frontend.yml'
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'src/Presentation/NutritionTracker.Web/**'
  workflow_dispatch:

env:
  APP_LOCATION: 'src/Presentation/NutritionTracker.Web'
  # Pre-built output folder, passed directly as app_location on deploy (avoids output_location
  # being resolved relative to repo root instead of APP_LOCATION when skip_app_build is true).
  DIST_LOCATION: 'src/Presentation/NutritionTracker.Web/dist'

jobs:
  build-and-deploy:
    if: github.event_name != 'pull_request' || github.event.action != 'closed'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: ${{ env.APP_LOCATION }}
        run: npm ci

      - name: Build
        working-directory: ${{ env.APP_LOCATION }}
        # VITE_API_URL must point at the deployed Function App, e.g. https://func-nutrition-tracker-dev.azurewebsites.net
        run: npm run build
        env:
          VITE_API_URL: ${{ vars.FUNCTION_APP_URL }}

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: 'upload'
          app_location: ${{ env.DIST_LOCATION }}
          output_location: ''
          skip_app_build: true

  close-pull-request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close PR preview environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          app_location: ${{ env.APP_LOCATION }}
          action: 'close'
