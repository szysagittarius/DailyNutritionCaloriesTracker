name: Deploy Backend (Azure Functions)

on:
  push:
    branches: [main]
    paths:
      - 'src/Adapters/Input/NutritionTracker.AzureFunctions/**'
      - 'src/Adapters/Output/NutritionTracker.AzureTableStorage/**'
      - 'src/Adapters/Output/NutritionTracker.Persistence.Contracts/**'
      - 'src/Adapters/Input/NutritionTracker.Api.Contracts/**'
      - 'src/Core/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  # Must match the Function App name created by infrastructure.yml for the 'dev' environment
  AZURE_FUNCTIONAPP_NAME: 'func-nutrition-tracker-dev'
  AZURE_FUNCTIONAPP_PACKAGE_PATH: './src/Adapters/Input/NutritionTracker.AzureFunctions'
  DOTNET_VERSION: '8.0.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore src/NutritionTracker.sln

      - name: Build solution
        run: dotnet build src/NutritionTracker.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test src/NutritionTracker.sln --configuration Release --no-build --verbosity normal

      - name: Publish Azure Functions
        run: |
          dotnet publish ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/NutritionTracker.AzureFunctions.csproj \
            --configuration Release \
            --output ./output

      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
          package: ./output
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}
